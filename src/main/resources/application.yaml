# Configuração Padrão (Usada no IntelliJ)
spring:
  application:
    name: vehicle-sales-api
  profiles:
    active: dev
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

---
# Perfil DEV: Roda no IntelliJ usando H2 em memória
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:vehicle_sales_db
    driverClassName: org.h2.Driver
    username: sa
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

---
# Perfil PROD: Roda no Docker usando o banco Postgres
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driverClassName: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
