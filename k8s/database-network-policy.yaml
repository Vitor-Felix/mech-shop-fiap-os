apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vehicle-sales-db-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vehicle-sales-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vehicle-sales-api
      ports:
        - protocol: TCP
          port: 5432
